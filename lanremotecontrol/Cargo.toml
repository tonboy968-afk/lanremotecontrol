[workspace]
resolver = "2"
members = [
    "common",
    "host",
    "client",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["LANRemoteControl Team"]
description = "Pure LAN PC remote control software with extremely low latency, lossless image quality, and minimalist UI"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
bincode = "1.3"
lz4 = "1.28"
xxhash-rust = { version = "0.8", features = ["xxh32"] }
windows-core = "0.58"
windows = { version = "0.58", features = [
    "Win32_Graphics_Dxgi",
    "Win32_Graphics_Direct3D",
    "Win32_Graphics_Direct3D11",
    "Win32_Graphics_Dxgi_Common",
    "Win32_System_Com",
    "Win32_Graphics_Gdi",
    "Win32_Foundation",
] }
